name: Plan the terraform Code
on:
    push: 
        branches: 
            - main
            - stage
        paths: terraform/**
    pull_request: 
        branches:
            - main
        paths: terraform/**
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-east-1
  BUCKET_NAME: ${{ secrets.TF_STATE_S3_NAME }}
  EKS_NAME: vprofile-eks
    
jobs:
    terraform-plan:
        runs-on: ubuntu-latest
        defaults:
            run:
              shell: bash
              working-directory: terraform/ 
        
        steps:
          - name: Check out source code
            uses: actions/checkout@v4

          - name: Setup up a terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: "1.6.3"
        
          - name: Terrafom init
            id: init
            run: terraform init -backend-config="bucket=$BUCKET_NAME"

          - name: Terraform format
            id: fmt
            run: terraform fmt

          - name: Terraform validate
            id: validate
            run: terraform validate
        
          - name: Terraform plan
            id: plan
            run: terraform plan -no-color -input=false -out planfile

          - name: Terraform plan status
            id: status
            if: steps.plan.outcome == 'failure'
            run: exit 1
            
          - name: Terraform apply
            id: apply
            if: github.ref == 'refs/heads/main' && github.event_name == 'push'
            run: |
              terraform apply --auto-approve -input=false -parallelism=1 planfile
        
          - name: Configure AWS Credentials
            id: configure-aws-cli
            uses: aws-actions/configure-aws-credentials@v4
            with:
              aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
              aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws-region: us-east-1
        
          - name: Update Kubeconfig
            id: kube-config
            if: steps.apply.outcome == 'success'
            run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_NAME }}

          - name: Install Nginx Controller
            id: nginx-controller
            if: steps.apply.outcome == 'success' && github.event_name == 'push'
            run: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.1.3/deploy/static/provider/aws/deploy.yaml
         